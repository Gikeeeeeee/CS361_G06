# THIS IS TESTING FOR CD
# GitHub Actions workflow for CD
# Deploys Terraform infrastructure to AWS after changes are merged
name: CD

# Run CD when changes are pushed to the deployment branch
on:
  push:
    branches:
      - ci/cd-github-actions

jobs:
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    # Terraform root directory
    defaults:
      run:
        working-directory: terraform/terraform-backend

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Show Terraform changes before deployment
      - name: Terraform Plan
        run: terraform plan

      # Deploy infrastructure
      - name: Terraform Apply
        run: terraform apply -auto-approve
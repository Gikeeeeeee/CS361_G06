# --------------------------------------------------
# Continuous Deployment (CD)
# --------------------------------------------------

name: CD

# Only main deploys. Feature branches must never apply to the
# default (team) workspace; use the sandbox workspace by hand.
on:
  push:
    branches:
      - main

# Prevent multiple Terraform deployments on the same branch
# from running at the same time.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # --------------------------------------------------
  # Terraform Deployment
  # --------------------------------------------------

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    # Prevent Terraform from running forever
    timeout-minutes: 30

    # Always use the team state; Terraform also validates workspace/bucket identity.
    env:
      TF_WORKSPACE: default

    defaults:
      run:
        working-directory: terraform/terraform-backend

    steps:

      # --------------------------------------------------
      # Checkout Source Code
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          # Must match the state bucket region in backend.tf
          aws-region: ap-southeast-2

      # --------------------------------------------------
      # Write terraform.tfvars
      # --------------------------------------------------
      # The TF_VARS_FILE secret holds the exact contents of the
      # team's terraform.tfvars. Using the same file as a local
      # `terraform apply` means CD can never plan a different
      # stack (different names/region) against the shared state.

      - name: Write terraform.tfvars
        env:
          TF_VARS_FILE: ${{ secrets.TF_VARS_FILE }}
        run: |
          if [ -z "$TF_VARS_FILE" ]; then
            echo "::error::TF_VARS_FILE secret is not set"
            exit 1
          fi
          printf '%s\n' "$TF_VARS_FILE" > terraform.tfvars

      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # --------------------------------------------------
      # Refuse Destructive Plans
      # --------------------------------------------------
      # A plan that deletes or replaces anything usually means CD
      # is pointed at the wrong state or wrong variables. Stop and
      # let a human run it locally instead.
      # terraform_data (the Lambda pip build step) is replaced on
      # every code change by design and is not a real AWS resource.

      - name: Refuse destructive plan
        run: |
          filter='.resource_changes[]? | select(.type != "terraform_data") | select(.change.actions | index("delete"))'
          deletes=$(terraform show -json tfplan | jq "[$filter] | length")
          if [ "$deletes" -gt 0 ]; then
            terraform show -json tfplan | jq -r "$filter | \"  \(.change.actions | join(\"/\")) \(.address)\""
            echo "::error::Plan deletes or replaces $deletes resource(s). Run it locally after review."
            exit 1
          fi

      # --------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      # Verification runs only after a successful apply. A failure stops CD;
      # it never applies again, rolls back, or destroys infrastructure.
      - name: Setup Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify deployed API and SVG assets
        run: |
          API_BASE_URL="$(terraform output -raw api_endpoint)"
          ASSET_BASE_URL="$(terraform output -raw cdn_url)"
          export API_BASE_URL ASSET_BASE_URL
          python ../../scripts/smoke_test.py

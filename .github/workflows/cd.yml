# --------------------------------------------------
# Continuous Deployment (CD)
# --------------------------------------------------

name: CD

# Only main deploys. Feature branches must never apply to the
# default (team) workspace. No alternate deployment workflow is supported.
on:
  push:
    branches:
      - main

# Prevent multiple Terraform deployments on the same branch
# from running at the same time.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # --------------------------------------------------
  # Terraform Deployment
  # --------------------------------------------------

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    # Prevent Terraform from running forever
    timeout-minutes: 30

    # Always use the team state; Terraform also validates workspace/bucket identity.
    env:
      TF_WORKSPACE: default

    defaults:
      run:
        working-directory: terraform/terraform-backend

    steps:

      # --------------------------------------------------
      # Checkout Source Code
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for deployment validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No target selector or guessed IDs. Stop before credentials or any writes
      # until existing frontend state/hosting ownership is independently verified.
      - name: Validate existing frontend ownership boundary
        id: targets
        run: python ../../scripts/deployment_guard.py frontend-boundary

      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------

      - name: Configure AWS Credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          # Must match the state bucket region in backend.tf
          aws-region: ap-southeast-2

      # --------------------------------------------------
      # Write terraform.tfvars
      # --------------------------------------------------
      # The TF_VARS_FILE secret holds the exact contents of the
      # team's terraform.tfvars. Using the same file as a local
      # `terraform apply` means CD can never plan a different
      # stack (different names/region) against the shared state.

      - name: Write terraform.tfvars
        env:
          TF_VARS_FILE: ${{ secrets.TF_VARS_FILE }}
        run: |
          if [ -z "$TF_VARS_FILE" ]; then
            echo "::error::TF_VARS_FILE secret is not set"
            exit 1
          fi
          printf '%s\n' "$TF_VARS_FILE" > terraform.tfvars

      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -out=tfplan

      # --------------------------------------------------
      # Refuse Destructive Plans
      # --------------------------------------------------
      # Bind the plan to the existing state, caller and configured region.
      # Creates, deletes, replacements, identity/IAM/environment changes and
      # ambiguous evidence are refused, including local build-helper replacement.

      - name: Refuse destructive plan
        id: plan_safety
        shell: bash
        env:
          DEPLOY_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: |
          DEPLOY_WORKSPACE="$(terraform workspace show)"
          export DEPLOY_WORKSPACE
          terraform show -json tfplan | python ../../scripts/deployment_guard.py backend-plan \
            --plan - --backend-metadata .terraform/terraform.tfstate --backend-source backend.tf

      # --------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        id: apply
        run: terraform apply -input=false tfplan

      # Verification runs only after a successful apply. A failure stops CD;
      # it never applies again, rolls back, or destroys infrastructure.
      - name: Verify deployed API and SVG assets
        id: smoke
        run: |
          API_BASE_URL="$(terraform output -raw api_endpoint)"
          ASSET_BASE_URL="$(terraform output -raw cdn_url)"
          export API_BASE_URL ASSET_BASE_URL
          python ../../scripts/smoke_test.py

      # Failure reporting is local metadata only, never a second deployment.
      - name: Record deployment verification evidence
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        env:
          TARGET_STATUS: ${{ steps.targets.outcome }}
          PLAN_STATUS: ${{ steps.plan.outcome }}
          SAFETY_STATUS: ${{ steps.plan_safety.outcome }}
          APPLY_STATUS: ${{ steps.apply.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          {
            echo '## Existing application deployment'
            printf 'UTC: %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| Check | Outcome |\n|---|---|\n'
            printf '| Target readiness | %s |\n| Plan | %s |\n| Existing-resource safety | %s |\n| Apply | %s |\n| API/SVG smoke | %s |\n' "$TARGET_STATUS" "$PLAN_STATUS" "$SAFETY_STATUS" "$APPLY_STATUS" "$SMOKE_STATUS"
            echo
            echo 'Frontend ownership is unverified: deployment is blocked before credentials/writes. No frontend upload or invalidation is implemented.'
            echo 'Failure/skipped verification is not a successful release. No automatic rollback or repeat apply.'
          } >> "$GITHUB_STEP_SUMMARY"

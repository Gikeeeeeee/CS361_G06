# GitHub Actions workflow for CI
# Runs automated tests and Terraform validation on Pull Requests
name: CI

# Validate pull requests to the deployment and integration branches.
on:
  pull_request:
    branches:
      - main
      - V4
      - V5

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build (verification only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Reserved .invalid domains: these artifacts cannot target a deployment.
      # PR checks never consume production configuration or AWS credentials.
      - name: Build isolated frontend with locked dependencies
        env:
          VITE_API_BASE_URL: https://api.invalid
          VITE_SUPABASE_URL: https://auth.invalid
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_verification_only
        run: python scripts/frontend_release.py build --output scratch/frontend-ci
      - name: Verify artifact integrity
        run: python scripts/frontend_release.py verify --artifact scratch/frontend-ci
      - name: Retain verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-${{ github.sha }}
          path: scratch/frontend-ci/
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------
  # Python Tests
  # --------------------------------------------------
  # Runs Unit, Handler, and Integration tests.
  # API Contract tests are excluded because they require
  # a live AWS API and AWS credentials.
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout the source code from the Pull Request
      - name: Checkout
        uses: actions/checkout@v4

      # Install Python 3.13
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Run all tests except API Contract tests
      # API tests are excluded because they require AWS/API Gateway.
      - name: Run tests
        run: |
          cd backend
          pytest -v -m "not api"

      - name: Smoke test script unit tests
        run: python -m pytest -v scripts/tests

  # --------------------------------------------------
  # Terraform Validation
  # --------------------------------------------------
  # Validates the Terraform configuration without
  # connecting to or modifying AWS infrastructure.
  terraform:
    name: Terraform Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [terraform-backend, terraform-frontend]

    # Validate each root without accessing remote state or AWS credentials.
    defaults:
      run: 
        working-directory: terraform/${{ matrix.root }}
    steps:
      # Checkout the source code from the Pull Request
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Initialize Terraform without configuring
      # or connecting to a remote backend.
      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      # Check whether the Terraform configuration is valid
      - name: Terraform Validate
        run: terraform validate

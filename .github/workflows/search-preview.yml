name: OpenSearch PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - main
      - ci/cd-github-actions
      - v1-known-issue
      - refactor/ci/cd

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: opensearch-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_pr_number: ${{ github.event.pull_request.number }}

jobs:
  changes:
    name: Detect Search Changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      search: ${{ steps.filter.outputs.search }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect relevant files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            search:
              - 'backend/**'
              - 'terraform/terraform-backend/modules/opensearch/**'
              - 'terraform/opensearch-preview/**'

  preview:
    name: Create OpenSearch Preview
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      needs.changes.outputs.search == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: terraform/opensearch-preview

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Initialize isolated PR state
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/opensearch-preview/pr-${{ github.event.pull_request.number }}.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=preview.tfplan

      - name: Apply preview
        run: terraform apply -input=false -auto-approve preview.tfplan

      - name: Show preview endpoint
        run: terraform output -raw collection_endpoint

  cleanup:
    name: Destroy OpenSearch Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: terraform/opensearch-preview

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Initialize isolated PR state
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/opensearch-preview/pr-${{ github.event.pull_request.number }}.tfstate"

      - name: Check for existing state
        id: state
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET is not configured."
            exit 1
          fi

          STATE_KEY="terraform/opensearch-preview/pr-${PR_NUMBER}.tfstate"

          if aws s3api head-object \
            --bucket "$TF_STATE_BUCKET" \
            --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Terraform state exists for PR #${PR_NUMBER}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform state found for PR #${PR_NUMBER}; skipping destroy."
          fi

      - name: Destroy preview resources
        if: steps.state.outputs.exists == 'true'
        run: terraform destroy -input=false -auto-approve
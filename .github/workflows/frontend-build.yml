name: Frontend Build Preparation

# Build only. No deploy job, AWS credentials, upload-to-S3 or invalidation step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare frontend artifact (deployment disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Public browser configuration only; never supply a Supabase service key.
      # Missing values fail before dependency installation/build.
      - name: Build isolated frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_VERSION: ${{ vars.VITE_API_VERSION }}
        run: python scripts/frontend_release.py build --output scratch/frontend-prepared
      - name: Verify artifact integrity
        run: python scripts/frontend_release.py verify --artifact scratch/frontend-prepared
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-prepared-${{ github.sha }}
          path: scratch/frontend-prepared/
          if-no-files-found: error
          retention-days: 7

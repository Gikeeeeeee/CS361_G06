<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" font-size="11" style="background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 11px;">
  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .room-shape.restroom {
      fill: #fef08a;
      stroke: #ffffff;
    }
    .water-body {
      fill: #bae6fd;
      stroke: #38bdf8;
      stroke-width: 1.5;
    }
    .bridge-body {
      fill: #94a3b8;
      stroke: #475569;
      stroke-width: 2;
    }
    .stair-tread {
      stroke: #475569;
      stroke-width: 1.5;
    }
    .stair-boundary {
      fill: #e2e8f0;
      stroke: #64748b;
      stroke-width: 2;
      cursor: pointer;
    }
    .void-line {
      stroke: #64748b;
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
    }
    .room-text {
      fill: #334155;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
  </style>

  <!-- 1. สระน้ำตรงกลาง (Water Area) -->
  <path class="water-body" d="M 150 220 L 310 220 L 310 300 L 680 300 L 680 370 L 300 370 L 300 270 L 150 270 Z" />

  <!-- 2. บันไดและสะพานเชื่อมแกนกลาง (Center Stair & Bridge) -->
  <g id="facility-bridge">
    <!-- กรอบตัวโครงสร้างสะพานและบันไดเชื่อม -->
    <rect class="bridge-body" x="470" y="210" width="50" height="180" rx="3" />
    
    <!-- 2.1 บันไดขึ้นสู่ชั้น 2 ทางทิศเหนือ -->
    <rect class="stair-boundary" x="476" y="215" width="38" height="65" rx="2" />
    <!-- ขั้นบันได -->
    <line class="stair-tread" x1="476" y1="222" x2="514" y2="222" />
    <line class="stair-tread" x1="476" y1="229" x2="514" y2="229" />
    <line class="stair-tread" x1="476" y1="236" x2="514" y2="236" />
    <line class="stair-tread" x1="476" y1="243" x2="514" y2="243" />
    <line class="stair-tread" x1="476" y1="250" x2="514" y2="250" />
    <line class="stair-tread" x1="476" y1="257" x2="514" y2="257" />
    <line class="stair-tread" x1="476" y1="264" x2="514" y2="264" />
    <line class="stair-tread" x1="476" y1="271" x2="514" y2="271" />
    <!-- ชานพักและราวจับบันไดตรงกลาง -->
    <rect x="480" y="266" width="30" height="10" fill="none" stroke="#475569" stroke-width="1.2" />
    <line x1="495" y1="215" x2="495" y2="266" stroke="#475569" stroke-width="1.5" />
    <!-- ลูกศรบอกทิศทางขึ้นบันได -->
    <path d="M 495 270 L 495 218 M 491 223 L 495 218 L 499 223" fill="none" stroke="#2563eb" stroke-width="1.5" />

    <!-- 2.2 โถงช่องเปิดด้านล่าง (Void / Cross pattern พร้อมวงกลมตรงกลางตาม Floor Plan จริง) -->
    <line class="void-line" x1="476" y1="290" x2="514" y2="380" />
    <line class="void-line" x1="514" y1="290" x2="476" y2="380" />
    <circle cx="495" cy="335" r="5" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  </g>


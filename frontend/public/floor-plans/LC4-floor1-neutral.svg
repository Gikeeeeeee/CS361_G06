<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" font-size="12" style="background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <!-- ลวดลายขั้นบันได Realistic Stair Pattern -->
    <pattern id="stairPattern" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="1.2" />
      <line x1="0" y1="3" x2="10" y2="3" stroke="#94a3b8" stroke-width="0.8" />
    </pattern>

    <!-- ลวดลายและไอคอนลิฟต์ Elevator Pattern -->
    <pattern id="elevatorPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e2e8f0" />
      <rect x="5" y="5" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
      <rect x="22" y="5" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
      <path d="M 12 20 L 16 14 L 20 20 Z" fill="#2563eb" />
      <path d="M 20 20 L 24 26 L 28 20 Z" fill="#2563eb" />
    </pattern>
  </defs>

  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .room-shape.restroom {
      fill: #fef9c3;
      stroke: #ffffff;
    }
    .stair-boundary {
      fill: #f1f5f9;
      stroke: #64748b;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .stair-treads {
      fill: url(#stairPattern);
      stroke: #64748b;
      stroke-width: 1;
    }
    .elevator-boundary {
      fill: #f1f5f9;
      stroke: #64748b;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .facility-shape {
      fill: #e2e8f0;
      stroke: #94a3b8;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .facility-shape.highlight {
      fill: #2563eb !important;
      stroke: #ffffff !important;
    }
    .room-text {
      fill: #334155;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text, .facility-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
    .corridor {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
  </style>

  <!-- ==================== 1. ทางเดินหลัก (Corridor) ==================== -->
  <path class="corridor" d="M 130 130 L 500 130 L 500 350 L 130 350 Z" />

  <!-- ==================== 2. ห้องเรียนและห้องปฏิบัติการ (Rooms) ==================== -->
  <!-- โซนบน -->
  <rect id="room-lab102" class="room-shape" x="350" y="50" width="100" height="80" rx="4" />
  <rect id="room-lab103" class="room-shape" x="250" y="50" width="100" height="80" rx="4" />
  <rect id="room-lab104" class="room-shape" x="130" y="50" width="120" height="80" rx="4" />
  <rect id="room-lab105" class="room-shape" x="50" y="50" width="80" height="150" rx="4" />
  <rect id="room-faculty-offices" class="room-shape" x="450" y="50" width="50" height="80" rx="4" />
  <rect id="room-commonroom2" class="room-shape" x="500" y="50" width="90" height="80" rx="4" />
  <rect id="room-commonroom3" class="room-shape" x="600" y="50" width="100" height="80" rx="4" />

  <!-- โซนขวา -->
  <rect id="room-commonroom1" class="room-shape" x="600" y="250" width="100" height="100" rx="4" />

  <!-- โซนล่าง -->
  <rect id="room-lab106" class="room-shape" x="160" y="350" width="140" height="100" rx="4" />
  <rect id="room-lab107" class="room-shape" x="50" y="350" width="110" height="100" rx="4" />

  <!-- ห้องน้ำ (Restroom) -->
  <rect id="room-restroom" class="room-shape restroom" x="50" y="210" width="40" height="45" rx="4" />

  <!-- ==================== 3. สิ่งอำนวยความสะดวก (Facilities) ==================== -->
  <!-- ลิฟต์ (Elevator) -->
  <g id="facility-elevator">
    <rect class="elevator-boundary" x="100" y="210" width="40" height="40" rx="4" />
    <!-- ประตูลิฟต์คู่และไอคอน -->
    <rect x="105" y="215" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
    <rect x="122" y="215" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
    <path d="M 116 226 L 120 220 L 124 226 Z" fill="#2563eb" />
    <path d="M 116 234 L 120 240 L 124 234 Z" fill="#2563eb" />
  </g>

  <!-- บันได 3 (Stair 3 - ปีกซ้าย) -->
  <g id="facility-stair3">
    <rect class="stair-boundary" x="50" y="265" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="53" y="268" width="34" height="28" rx="2" />
    <path d="M 70 294 L 70 270 M 67 274 L 70 270 L 73 274" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- บันได 2 (Stair 2 - กลางขวา) -->
  <g id="facility-stair2">
    <rect class="stair-boundary" x="450" y="200" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="453" y="203" width="34" height="28" rx="2" />
    <path d="M 470 229 L 470 205 M 467 209 L 470 205 L 473 209" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- บันได 1 (Stair 1 - ล่างขวา) -->
  <g id="facility-stair1">
    <rect class="stair-boundary" x="450" y="350" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="453" y="353" width="34" height="28" rx="2" />
    <path d="M 470 379 L 470 355 M 467 359 L 470 355 L 473 359" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- ==================== 4. ป้ายกำกับ (Labels & Typography) ==================== -->
  <text x="400" y="90" class="room-text">LAB102</text>
  <text x="300" y="90" class="room-text">LAB103</text>
  <text x="190" y="90" class="room-text">LAB104</text>
  <text x="90" y="125" class="room-text">LAB105</text>
  <text x="475" y="90" class="room-text" font-size="9">Offices</text>
  <text x="545" y="90" class="room-text" font-size="10">Common 2</text>
  <text x="650" y="90" class="room-text" font-size="10">Common 3</text>

  <text x="650" y="300" class="room-text" font-size="11">CommonRoom1</text>

  <text x="230" y="400" class="room-text">LAB106</text>
  <text x="105" y="400" class="room-text">LAB107</text>

  <text x="70" y="232" class="room-text" font-size="8">Restroom</text>
  <text x="70" y="318" class="room-text" font-size="8">Stair 3</text>
  <text x="120" y="258" class="room-text" font-size="8">Elevator</text>

  <text x="470" y="252" class="room-text" font-size="8">Stair 2</text>
  <text x="470" y="402" class="room-text" font-size="8">Stair 1</text>
</svg>

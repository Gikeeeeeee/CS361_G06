<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #f8fafc; font-family: sans-serif;">
  <style>
    .room-shape { fill: #cbd5e1; stroke: #ffffff; stroke-width: 2; transition: all 0.2s ease-in-out; cursor: pointer; }
    .room-shape:hover { fill: #94a3b8; }
    .room-shape.highlight { fill: #2563eb !important; stroke: #1e40af !important; stroke-width: 3; }
    .facility-shape { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4; cursor: pointer; }
    .facility-shape.highlight { fill: #2563eb !important; stroke: #ffffff !important; }
    .room-text { fill: #334155; font-size: 12px; font-weight: bold; text-anchor: middle; pointer-events: none; }
    .room-shape.highlight + .room-text, .facility-shape.highlight + .room-text { fill: #ffffff !important; }
    .corridor { fill: #f1f5f9; }
  </style>

  <!-- ทางเดินหลัก (Corridor) -->
  <path class="corridor" d="M 130 130 L 500 130 L 500 350 L 130 350 Z" />

  <!-- โซนด้านบน: LAB Chem 305, 304, 303, 302 และ ศูนย์บริการ 318 -->
  <rect id="room-305" class="room-shape" x="50" y="50" width="80" height="50" />
  <rect id="room-306" class="room-shape" x="50" y="100" width="80" height="50" />
  <rect id="room-304" class="room-shape" x="130" y="50" width="90" height="80" />
  <rect id="room-303" class="room-shape" x="220" y="50" width="90" height="80" />
  <rect id="room-302" class="room-shape" x="310" y="50" width="120" height="80" />
  <rect id="room-318" class="room-shape" x="500" y="50" width="130" height="90" />

  <!-- โซน Facilities ฝั่งซ้ายกลาง (ตรงกับ Floor 1 และ 2) -->
  <rect id="room-restroom" class="room-shape" x="50" y="210" width="40" height="40" />
  <rect id="facility-stair3" class="facility-shape" x="50" y="255" width="40" height="40" />
  <rect id="facility-elevator" class="facility-shape" x="100" y="210" width="40" height="40" />

  <!-- โซนฝั่งซ้ายล่าง: Lab 308 (ตรงกับ 307 LAB ในรูป) -->
  <rect id="room-308" class="room-shape" x="50" y="300" width="80" height="65" />

  <!-- โซนด้านล่าง: ห้องพักอาจารย์ -->
  <rect id="room-faculty-office" class="room-shape" x="50" y="375" width="220" height="65" />

  <!-- ห้องเรียน 500 คน -->
  <polygon id="room-500" class="room-shape" points="500,180 650,180 720,250 720,450  500,450" />

  <!-- Facilities ฝั่งขวา: Stair 1 (ตัด Stair 2 ออกตามมาตรฐาน) -->
  <rect id="facility-stair1" class="facility-shape" x="450" y="350" width="40" height="40" />

  <!-- Labels -->
  <text x="90" y="80" class="room-text" font-size="10">305</text>
  <text x="90" y="130" class="room-text" font-size="10">306</text>
  <text x="175" y="95" class="room-text" font-size="10">304</text>
  <text x="265" y="95" class="room-text" font-size="10">303</text>
  <text x="370" y="95" class="room-text" font-size="11">Lab Chem 302</text>
  <text x="565" y="100" class="room-text" font-size="13">ศูนย์บริการ 318</text>

  <text x="70" y="235" class="room-text" font-size="8">Restroom</text>
  <text x="70" y="280" class="room-text" font-size="8">Stair 3</text>
  <text x="120" y="235" class="room-text" font-size="8">Elevator</text>

  <text x="90" y="338" class="room-text" font-size="11">Lab 308</text>
  <text x="160" y="415" class="room-text" font-size="13">ห้องพักอาจารย์</text>

  <text x="600" y="300" class="room-text" style="font-size: 16px;">ห้องเรียน 500 คน</text>
  <text x="470" y="373" class="room-text" font-size="9">Stair 1</text>
</svg>

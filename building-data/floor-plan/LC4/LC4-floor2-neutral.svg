<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" font-size="12" style="background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <!-- ลวดลายขั้นบันได Realistic Stair Pattern -->
    <pattern id="stairPattern" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#64748b" stroke-width="1.2" />
      <line x1="0" y1="3" x2="10" y2="3" stroke="#94a3b8" stroke-width="0.8" />
    </pattern>

    <!-- ลวดลายและไอคอนลิฟต์ Elevator Pattern -->
    <pattern id="elevatorPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e2e8f0" />
      <rect x="5" y="5" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
      <rect x="22" y="5" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
      <path d="M 12 20 L 16 14 L 20 20 Z" fill="#2563eb" />
      <path d="M 20 20 L 24 26 L 28 20 Z" fill="#2563eb" />
    </pattern>
  </defs>

  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .room-shape.restroom {
      fill: #fef9c3;
      stroke: #ffffff;
    }
    .stair-boundary {
      fill: #f1f5f9;
      stroke: #64748b;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .stair-treads {
      fill: url(#stairPattern);
      stroke: #64748b;
      stroke-width: 1;
    }
    .elevator-boundary {
      fill: #f1f5f9;
      stroke: #64748b;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .facility-shape {
      fill: #e2e8f0;
      stroke: #94a3b8;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .facility-shape.highlight {
      fill: #2563eb !important;
      stroke: #ffffff !important;
    }
    .room-text {
      fill: #334155;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text, .facility-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
    .corridor {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
  </style>

  <!-- ==================== 1. ทางเดินหลัก (Corridor) ==================== -->
  <path class="corridor" d="M 130 130 L 500 130 L 500 350 L 130 350 Z" />

  <!-- ==================== 2. ห้องเรียนและสำนักงาน (Rooms) ==================== -->
  <!-- โซนบน -->
  <rect id="room-201" class="room-shape" x="50" y="50" width="80" height="150" rx="4" />
  <rect id="room-202-3" class="room-shape" x="130" y="50" width="100" height="80" rx="4" />
  <rect id="room-202-2" class="room-shape" x="230" y="50" width="100" height="80" rx="4" />
  <rect id="room-202-1" class="room-shape" x="330" y="50" width="100" height="80" rx="4" />
  <rect id="room-204" class="room-shape" x="430" y="50" width="90" height="80" rx="4" />
  <rect id="room-209" class="room-shape" x="520" y="50" width="80" height="80" rx="4" />

  <!-- ห้องน้ำ (Restroom) -->
  <rect id="room-restroom" class="room-shape restroom" x="50" y="210" width="40" height="40" rx="4" />

  <!-- ห้อง 210 ซ้ายล่าง -->
  <rect id="room-210" class="room-shape" x="50" y="305" width="80" height="60" rx="4" />

  <!-- โซนล่าง: ห้อง 211-215 -->
  <rect id="room-211" class="room-shape" x="50" y="375" width="65" height="75" rx="4" />
  <rect id="room-212" class="room-shape" x="115" y="375" width="65" height="75" rx="4" />
  <rect id="room-213" class="room-shape" x="180" y="375" width="65" height="75" rx="4" />
  <rect id="room-214" class="room-shape" x="245" y="375" width="65" height="75" rx="4" />
  <rect id="room-215" class="room-shape" x="310" y="375" width="65" height="75" rx="4" />

  <!-- โซนขวา: ห้องบรรยายขนาดใหญ่ 500 คน -->
  <polygon id="room-500" class="room-shape" points="500,180 650,180 720,250 720,450 500,450" />

  <!-- ==================== 3. สิ่งอำนวยความสะดวก (Facilities) ==================== -->
  <!-- ลิฟต์ (Elevator) -->
  <g id="facility-elevator">
    <rect class="elevator-boundary" x="100" y="210" width="40" height="40" rx="4" />
    <rect x="105" y="215" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
    <rect x="122" y="215" width="13" height="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="1" />
    <path d="M 116 226 L 120 220 L 124 226 Z" fill="#2563eb" />
    <path d="M 116 234 L 120 240 L 124 234 Z" fill="#2563eb" />
  </g>

  <!-- บันได 3 (Stair 3 - ปีกซ้าย) -->
  <g id="facility-stair3">
    <rect class="stair-boundary" x="50" y="255" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="53" y="258" width="34" height="28" rx="2" />
    <path d="M 70 284 L 70 260 M 67 264 L 70 260 L 73 264" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- บันได 2 (Stair 2 - กลางขวา) -->
  <g id="facility-stair2">
    <rect class="stair-boundary" x="450" y="200" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="453" y="203" width="34" height="28" rx="2" />
    <path d="M 470 229 L 470 205 M 467 209 L 470 205 L 473 209" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- บันได 1 (Stair 1 - ล่างขวา) -->
  <g id="facility-stair1">
    <rect class="stair-boundary" x="450" y="350" width="40" height="40" rx="4" />
    <rect class="stair-treads" x="453" y="353" width="34" height="28" rx="2" />
    <path d="M 470 379 L 470 355 M 467 359 L 470 355 L 473 359" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- ==================== 4. ป้ายกำกับ (Labels & Typography) ==================== -->
  <text x="90" y="125" class="room-text">201</text>
  <text x="180" y="90" class="room-text">202/3</text>
  <text x="280" y="90" class="room-text">202/2</text>
  <text x="380" y="90" class="room-text">202/1</text>
  <text x="475" y="90" class="room-text">204</text>
  <text x="560" y="90" class="room-text">209</text>

  <text x="70" y="230" class="room-text" font-size="8">Restroom</text>
  <text x="70" y="275" class="room-text" font-size="8">Stair 3</text>
  <text x="120" y="258" class="room-text" font-size="8">Elevator</text>

  <text x="90" y="335" class="room-text">210</text>
  <text x="82" y="415" class="room-text">211</text>
  <text x="147" y="415" class="room-text">212</text>
  <text x="212" y="415" class="room-text">213</text>
  <text x="277" y="415" class="room-text">214</text>
  <text x="342" y="415" class="room-text">215</text>

  <text x="605" y="315" class="room-text" font-size="15">ห้อง 500 คน</text>
  <text x="470" y="252" class="room-text" font-size="8">Stair 2</text>
  <text x="470" y="402" class="room-text" font-size="8">Stair 1</text>
</svg>

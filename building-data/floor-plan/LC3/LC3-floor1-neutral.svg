<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="background-color: #f8fafc; font-family: sans-serif;">
  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .facility-shape {
      fill: #e2e8f0;
      stroke: #94a3b8;
      stroke-width: 1.5;
      stroke-dasharray: 4;
      cursor: pointer;
    }
    .facility-shape.highlight {
      fill: #2563eb !important;
      stroke: #ffffff !important;
    }
    .room-text {
      fill: #334155;
      font-size: 11px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text,
    .facility-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
    .corridor {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
    .bridge {
      fill: #e2e8f0;
      stroke: #94a3b8;
      stroke-width: 1.5;
    }
  </style>

  <!-- ทางเดินหลักและสะพานเชื่อม -->
  <path class="corridor" d="M 150 220 L 310 220 L 310 300 L 680 300 L 680 370 L 300 370 L 300 270 L 150 270 Z" />
  <rect class="bridge" x="480" y="240" width="28" height="150" />


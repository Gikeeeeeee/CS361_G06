  <rect id="room-234" class="room-shape" x="845" y="130" width="85" height="42" rx="3" />
  <rect id="room-233" class="room-shape" x="845" y="172" width="85" height="85" rx="3" />
  
  <!-- บันไดฝั่งขวา (East Stair 1): วาดตามแบบแปลนจริง L-Shape Split -->
  <g id="facility-stair1">
    <!-- กรอบตัวบันได -->
    <rect class="stair-boundary" x="842" y="260" width="45" height="42" rx="2" />
    
    <!-- ชานพักฝั่งซ้าย (Landing) -->
    <line x1="860" y1="260" x2="860" y2="302" stroke="#64748b" stroke-width="1.5" />
    <path d="M 855 267 L 855 295 L 860 295" fill="none" stroke="#64748b" stroke-width="1" />
    
    <!-- ขั้นบันไดช่วงบน (Upper Flight) -->
    <line class="stair-tread" x1="860" y1="266" x2="887" y2="266" />
    <line class="stair-tread" x1="860" y1="272" x2="887" y2="272" />

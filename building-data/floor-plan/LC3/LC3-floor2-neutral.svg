<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" font-size="11" style="background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .room-shape.restroom {
      fill: #fef08a;
      stroke: #ffffff;
    }
    .stair-tread {
      stroke: #475569;
      stroke-width: 1.5;
    }
    .stair-boundary {
      fill: #e2e8f0;
      stroke: #64748b;
      stroke-width: 2;
      cursor: pointer;
    }
    .room-text {
      fill: #334155;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
    .corridor {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
    .void-area {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
  </style>

  <!-- โถงทางเดินหลัก (Corridor) -->
  <path class="corridor" d="M 140 140 L 400 140 L 400 200 L 510 200 L 510 140 L 840 140 L 840 460 L 510 460 L 510 400 L 420 400 L 420 460 L 140 460 Z" />

  <!-- ช่องเปิด Void โถงกลางซ้าย-ขวา -->
  <polygon class="void-area" points="160,160 370,160 370,360 160,360" />
  <line x1="160" y1="160" x2="370" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
  <line x1="370" y1="160" x2="160" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />

  <polygon class="void-area" points="620,150 820,150 820,380 620,380" />
  <line x1="620" y1="150" x2="820" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
  <line x1="820" y1="150" x2="620" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />

  <!-- ปีกซ้าย: โซนบน (209, 208, 207, 206, 205, 204) -->
  <rect id="room-209" class="room-shape" x="50" y="45" width="90" height="95" rx="3" />
  <rect id="room-208" class="room-shape" x="140" y="45" width="80" height="95" rx="3" />
  <rect id="room-207" class="room-shape" x="220" y="45" width="20" height="95" rx="2" />
  <rect id="room-206" class="room-shape" x="240" y="45" width="85" height="95" rx="3" />
  <rect id="room-205" class="room-shape" x="325" y="45" width="80" height="95" rx="3" />
  <rect id="room-204" class="room-shape" x="405" y="45" width="20" height="55" rx="2" />

  <!-- ปีกซ้าย: โซนริมซ้ายแนวดิ่ง (212, 213, Restroom, Stair 3, 217) -->
  <rect id="room-212" class="room-shape" x="50" y="140" width="90" height="45" rx="3" />
  <rect id="room-213" class="room-shape" x="50" y="185" width="90" height="90" rx="3" />

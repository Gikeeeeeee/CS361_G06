    <line class="stair-tread" x1="860" y1="296" x2="887" y2="296" />
    <line class="stair-tread" x1="860" y1="302" x2="887" y2="302" />

    <!-- ราวจับแกนกลาง (Handrail) -->
    <line x1="874" y1="260" x2="874" y2="290" stroke="#475569" stroke-width="1.2" />
    <!-- ลูกศรบอกทิศทาง -->
    <path d="M 879 298 L 879 264 M 876 268 L 879 264 L 882 268" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <rect id="room-restroom-right" class="room-shape restroom" x="888" y="260" width="42" height="50" rx="3" />
  <rect id="room-228" class="room-shape" x="845" y="310" width="18" height="18" rx="2" />
  <rect id="room-229" class="room-shape" x="863" y="310" width="18" height="18" rx="2" />
  <rect id="room-230" class="room-shape" x="881" y="315" width="44" height="60" rx="2" />

  <!-- ปีกขวา: โซนล่าง (222, 223 รูปตัว U ครอบ 224, 225, 226, 227) -->
  <rect id="room-222" class="room-shape" x="510" y="460" width="60" height="35" rx="3" />
  
  <!-- ห้อง 223 เป็นทรงตัว U โอบรอบซ้าย-ล่าง-ขวาของห้อง 224 -->
  <polygon id="room-223" class="room-shape" points="570,460 615,460 615,502 675,502 675,460 720,460 720,545 570,545" />
  <rect id="room-224" class="room-shape" x="615" y="460" width="60" height="42" rx="3" />

  <rect id="room-225" class="room-shape" x="720" y="460" width="75" height="85" rx="3" />

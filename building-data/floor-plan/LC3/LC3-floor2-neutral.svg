  <rect id="room-203" class="room-shape" x="400" y="100" width="85" height="90" rx="3" />
  <rect id="room-241" class="room-shape" x="505" y="98" width="85" height="92" rx="3" />
  <rect id="room-201" class="room-shape" x="370" y="215" width="85" height="170" rx="3" />
  
  <!-- บันไดแกนกลาง (Stair Center): วาดขั้นบันไดแบบมี Detail -->

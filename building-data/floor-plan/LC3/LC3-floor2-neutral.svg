  <!-- บันไดฝั่งซ้าย (West Stair 3): วาดตามแบบแปลนจริง L-Shape Split -->
  <g id="facility-stair3">
    <!-- กรอบตัวบันได -->
    <rect class="stair-boundary" x="95" y="280" width="45" height="45" rx="2" />
    
    <!-- ชานพักฝั่งซ้าย (Landing) -->
    <line x1="114" y1="280" x2="114" y2="325" stroke="#64748b" stroke-width="1.5" />
    <path d="M 109 288 L 109 317 L 114 317" fill="none" stroke="#64748b" stroke-width="1" />
    
    <!-- ขั้นบันไดช่วงบน (Upper Flight) -->
    <line class="stair-tread" x1="114" y1="286" x2="140" y2="286" />
    <line class="stair-tread" x1="114" y1="292" x2="140" y2="292" />
    <line class="stair-tread" x1="114" y1="298" x2="140" y2="298" />
    <line class="stair-tread" x1="114" y1="304" x2="140" y2="304" />
    <line class="stair-tread" x1="114" y1="310" x2="140" y2="310" />

    <!-- ขั้นบันไดช่วงหักเลี้ยวล่าง (Lower Landing / Flight) -->
    <rect x="114" y="310" width="26" height="15" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <line class="stair-tread" x1="114" y1="317" x2="140" y2="317" />
    <line class="stair-tread" x1="114" y1="324" x2="140" y2="324" />

    <!-- ราวจับแกนกลาง (Handrail) -->
    <line x1="127" y1="280" x2="127" y2="310" stroke="#475569" stroke-width="1.2" />
    <!-- ลูกศรบอกทิศทาง -->
    <path d="M 132 320 L 132 284 M 129 288 L 132 284 L 135 288" fill="none" stroke="#2563eb" stroke-width="1.2" />
  </g>

  <!-- ปีกซ้าย: โซนล่าง (217 ตัว L, 220, 221) -->
  <polygon id="room-217" class="room-shape" points="50,330 140,330 140,460 240,460 240,555 50,555" />
  <rect id="room-220" class="room-shape" x="240" y="460" width="185" height="95" rx="3" />
  <rect id="room-221" class="room-shape" x="425" y="460" width="60" height="32" rx="2" />


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #f8fafc; font-family: sans-serif;">
  <style>
    .room-shape {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .room-shape:hover {
      fill: #94a3b8;
    }
    .room-shape.highlight {
      fill: #2563eb !important;
      stroke: #1e40af !important;
      stroke-width: 3;
    }
    .facility-shape {
      fill: #e2e8f0;
      stroke: #94a3b8;
      stroke-width: 1.5;
      stroke-dasharray: 4;
      cursor: pointer;
    }
    .facility-shape.highlight {
      fill: #2563eb !important;
      stroke: #ffffff !important;
    }
    .room-text {
      fill: #334155;
      font-size: 11px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .room-shape.highlight + .room-text,
    .facility-shape.highlight + .room-text {
      fill: #ffffff !important;
    }
    .corridor {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
    .void-area {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
  </style>

  <!-- โถงทางเดินหลัก (Corridor) -->
  <path class="corridor" d="M 140 140 L 400 140 L 400 200 L 510 200 L 510 140 L 840 140 L 840 460 L 510 460 L 510 400 L 420 400 L 420 460 L 140 460 Z" />

  <!-- ช่องเปิด Void โถงกลางซ้าย-ขวา -->
  <polygon class="void-area" points="160,160 370,160 370,360 160,360" />
  <line x1="160" y1="160" x2="370" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
  <line x1="370" y1="160" x2="160" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />

  <polygon class="void-area" points="620,150 820,150 820,380 620,380" />
  <line x1="620" y1="150" x2="820" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
  <line x1="820" y1="150" x2="620" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />

  <!-- ปีกซ้าย: โซนบน (209, 208, 207, 206, 205, 204) -->
  <rect id="room-209" class="room-shape" x="50" y="45" width="90" height="95" />
  <rect id="room-208" class="room-shape" x="140" y="45" width="80" height="95" />
  <rect id="room-207" class="room-shape" x="220" y="45" width="20" height="95" />
  <rect id="room-206" class="room-shape" x="240" y="45" width="85" height="95" />
  <rect id="room-205" class="room-shape" x="325" y="45" width="80" height="95" />
  <rect id="room-204" class="room-shape" x="405" y="45" width="20" height="55" />

  <!-- ปีกซ้าย: โซนริมซ้ายแนวดิ่ง (212, 213, Restroom, Stair 3, 217) -->
  <rect id="room-212" class="room-shape" x="50" y="140" width="90" height="45" />
  <rect id="room-213" class="room-shape" x="50" y="185" width="90" height="90" />
  <rect id="room-restroom-left" class="room-shape" x="50" y="275" width="45" height="55" />
  <rect id="facility-stair3" class="facility-shape" x="95" y="285" width="45" height="45" />

  <!-- ปีกซ้าย: โซนล่าง (217 ตัว L, 220, 221) -->
  <polygon id="room-217" class="room-shape" points="50,330 140,330 140,460 240,460 240,555 50,555" />
  <rect id="room-220" class="room-shape" x="240" y="460" width="185" height="95" />
  <rect id="room-221" class="room-shape" x="425" y="460" width="60" height="32" />

  <!-- โถงกลาง: ห้อง 203, 241, 201, 242, 243, 243/1 และ บันไดแกนกลาง -->
  <rect id="room-203" class="room-shape" x="400" y="100" width="85" height="90" />
  <rect id="room-241" class="room-shape" x="505" y="98" width="85" height="92" />
  <rect id="room-201" class="room-shape" x="370" y="215" width="85" height="170" />
  
  <rect id="facility-stair-center" class="facility-shape" x="470" y="210" width="50" height="170" />

  <rect id="room-242" class="room-shape" x="540" y="210" width="80" height="20" />
  <rect id="room-243" class="room-shape" x="540" y="230" width="80" height="90" />
  <rect id="room-243-1" class="room-shape" x="540" y="320" width="80" height="60" />

  <!-- ปีกขวา: โซนบน (240, 239, 238, 237, 236/1, 236, 235) -->
  <rect id="room-240" class="room-shape" x="570" y="40" width="20" height="58" />
  <rect id="room-239" class="room-shape" x="590" y="40" width="80" height="88" />
  <rect id="room-238" class="room-shape" x="670" y="40" width="80" height="88" />
  <rect id="room-237" class="room-shape" x="750" y="40" width="20" height="88" />
  <rect id="room-236-1" class="room-shape" x="770" y="40" width="55" height="88" />
  <rect id="room-236" class="room-shape" x="825" y="40" width="25" height="88" />
  <rect id="room-235" class="room-shape" x="850" y="40" width="80" height="88" />

  <!-- ปีกขวา: โซนริมขวาแนวดิ่ง (234, 233, Restroom, Stair 1, 228, 229, 230) -->
  <rect id="room-234" class="room-shape" x="845" y="130" width="85" height="42" />
  <rect id="room-233" class="room-shape" x="845" y="172" width="85" height="85" />
  <rect id="facility-stair1" class="facility-shape" x="845" y="260" width="38" height="40" />
  <rect id="room-restroom-right" class="room-shape" x="883" y="260" width="42" height="50" />
  <rect id="room-228" class="room-shape" x="845" y="305" width="18" height="18" />
  <rect id="room-229" class="room-shape" x="863" y="305" width="18" height="18" />
  <rect id="room-230" class="room-shape" x="881" y="310" width="44" height="60" />

  <!-- ปีกขวา: โซนล่าง (222, 223 รูปตัว U ครอบ 224, 225, 226, 227) -->
  <rect id="room-222" class="room-shape" x="510" y="460" width="60" height="35" />
  
  <!-- ห้อง 223 เป็นทรงตัว U โอบรอบซ้าย-ล่าง-ขวาของห้อง 224 -->
  <polygon id="room-223" class="room-shape" points="570,460 615,460 615,502 675,502 675,460 720,460 720,545 570,545" />
  <rect id="room-224" class="room-shape" x="615" y="460" width="60" height="42" />

  <rect id="room-225" class="room-shape" x="720" y="460" width="75" height="85" />
  <rect id="room-226" class="room-shape" x="795" y="460" width="35" height="85" />
  <rect id="room-227" class="room-shape" x="830" y="460" width="100" height="85" />

  <!-- ป้ายข้อความ (Labels) -->
  <text x="95" y="92" class="room-text">209</text>
  <text x="180" y="92" class="room-text">208</text>
  <text x="230" y="92" class="room-text" font-size="8">207</text>
  <text x="282" y="92" class="room-text">206</text>
  <text x="365" y="92" class="room-text">205</text>
  <text x="415" y="72" class="room-text" font-size="7">204</text>

  <text x="95" y="162" class="room-text">212</text>
  <text x="95" y="230" class="room-text">213</text>
  <text x="72" y="302" class="room-text" font-size="8" transform="rotate(-90, 72, 302)">Restroom</text>
  <text x="117" y="307" class="room-text" font-size="8" transform="rotate(-90, 117, 307)">Stair 3</text>

  <text x="145" y="495" class="room-text" font-size="14">217</text>
  <text x="332" y="507" class="room-text" font-size="14">220</text>
  <text x="455" y="476" class="room-text" font-size="8">221</text>

  <text x="442" y="145" class="room-text">203</text>
  <text x="547" y="144" class="room-text">241</text>
  <text x="412" y="300" class="room-text" font-size="14">201</text>
  <text x="495" y="295" class="room-text" font-size="9" transform="rotate(-90, 495, 295)">Stair Center</text>

  <text x="580" y="220" class="room-text" font-size="7">242</text>
  <text x="580" y="275" class="room-text" font-size="7">243</text>
  <text x="580" y="350" class="room-text" font-size="9">243/1</text>

  <text x="580" y="69" class="room-text" font-size="7">240</text>
  <text x="630" y="84" class="room-text">239</text>
  <text x="710" y="84" class="room-text">238</text>
  <text x="760" y="84" class="room-text" font-size="8">237</text>
  <text x="797" y="84" class="room-text" font-size="8">236/1</text>
  <text x="837" y="84" class="room-text" font-size="8">236</text>
  <text x="890" y="84" class="room-text">235</text>

  <text x="887" y="151" class="room-text">234</text>
  <text x="887" y="214" class="room-text">233</text>
  <text x="864" y="280" class="room-text" font-size="8">Stair 1</text>
  <text x="904" y="285" class="room-text" font-size="8">Restroom</text>
  <text x="854" y="314" class="room-text" font-size="5">228</text>
  <text x="872" y="314" class="room-text" font-size="5">229</text>
  <text x="903" y="340" class="room-text">230</text>

  <text x="540" y="477" class="room-text" font-size="8">222</text>
  <text x="645" y="525" class="room-text">223</text>
  <text x="645" y="481" class="room-text" font-size="8">224</text>
  <text x="757" y="502" class="room-text">225</text>
  <text x="812" y="502" class="room-text" font-size="9">226</text>
  <text x="880" y="502" class="room-text">227</text>
</svg>
